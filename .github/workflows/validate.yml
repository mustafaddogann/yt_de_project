name: Credential-free validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: make check
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: docker build -t youtube-airflow containers/airflow
      - run: docker run --rm -v "$PWD/dags:/opt/airflow/dags" -v "$PWD/tests:/tests" youtube-airflow python /tests/check_dag_import.py
